[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshtastic-hermes-plugin"
version = "0.1.1"
description = "Hermes Agent plugin to interact with a Meshtastic mesh over TCP/IP and build a node-interaction knowledge base"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Pham" }]
keywords = ["meshtastic", "hermes", "hermes-agent", "lora", "mesh", "plugin"]

# `meshtastic` is a hard dependency so any pip-based install of this package
# (a local checkout, the published distribution, or `hermes plugins install`
# when it uses pip) pulls it automatically into Hermes' Python environment.
# Tool handlers still import-guard it so a bare directory-drop (no pip step) loads
# and degrades gracefully instead of crashing.
dependencies = [
  "PyYAML>=6.0",
  "meshtastic>=2.7.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "pytest-cov>=4.0"]

# Hermes discovers pip-installed plugins via this entry point group.
# - meshtastic_hermes: the tools/KB plugin (register lives in its __init__).
# - meshtastic_platform: the platform adapter (kind: platform) — bidirectional gateway.
[project.entry-points."hermes_agent.plugins"]
meshtastic = "meshtastic_hermes"
meshtastic-platform = "meshtastic_platform"

[tool.setuptools]
packages = ["meshtastic_hermes", "meshtastic_platform"]

[tool.setuptools.package-data]
# Ship the manifests + bundled skills so the package dirs work as drop-in plugin dirs.
meshtastic_hermes = ["plugin.yaml", "skills/*/SKILL.md"]
meshtastic_platform = ["plugin.yaml", "skills/*/SKILL.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["meshtastic_hermes", "meshtastic_platform"]

[tool.coverage.report]
# NOTE: deliberately no `fail_under`. Coverage is measured and reported, but it
# never fails the build — a coverage gate pushes people toward hollow tests on
# error branches to hit a number. The uncovered lines that remain are documented
# in ROADMAP.md; anything genuinely unreachable is marked `pragma: no cover`
# with the reason inline.
exclude_also = [
  # The module entry point: `python -m meshtastic_hermes` is covered by an
  # actual subprocess test, but the guard line itself never runs under pytest.
  "if __name__ == .__main__.:",
  # Import-time sys.path shim for directory-drop installs — runs before pytest
  # can observe it, and is exercised implicitly by every cross-package import.
  "if _REPO_ROOT not in sys.path:",
]
