# Manual minor release: 0.1.1 -> 0.2.0.
#
# Run it from the Actions tab when the accumulated patch bumps add up to
# something worth calling a release. Unlike the automatic patch bump, this
# one publishes a GitHub Release, with notes taken from CHANGELOG.md — which
# is the reason patch bumps only tag: so the Releases page stays a list of
# things worth reading rather than one entry per merged PR.
#
# There is deliberately no major (1.0.0) option. That is a decision to make
# by hand, not from a dropdown.
name: release (minor, manual)

# ---------------------------------------------------------------------------
# LOOP PREVENTION, LAYER 1 of 3
#
# workflow_dispatch only. This workflow cannot trigger itself: it does not
# listen to `push`, so the commit it makes to main is not a trigger event for
# it, and it is not a trigger event for version-bump.yml either (which
# listens only to merged pull requests).
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the bump without committing, tagging, or publishing"
        type: boolean
        default: false

# Least privilege: no workflow-level permissions at all. The write grant is
# scoped to the one job that pushes a commit, a tag, and a Release; anything
# added to this file later starts from the default read-only token and has to
# ask for more deliberately.
permissions: {}

# Share the concurrency group with the automatic patch bump: a release and a
# merge landing at the same moment would otherwise both write main. Never
# cancel-in-progress — a cancelled release can leave a tag without a Release,
# or a commit without its tag.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Pushing the bump commit, the tag, and creating the GitHub Release all
      # need this and nothing more.
      contents: write

    steps:
      # Actions pinned to commit SHAs, not mutable tags — a tag can be
      # repointed at new code. Same policy as tests.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install the package and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The release is cut from main as it stands; if main is red, the release
      # would ship it. Cheap insurance compared to a bad tag. Note this is a
      # GATE here even though tests.yml reports coverage without gating —
      # different question: "is main shippable right now".
      - name: Run the test suite before releasing
        run: pytest -q

      - name: Bump the minor version
        id: bump
        run: |
          python scripts/bump_version.py minor ${{ inputs.dry_run && '--dry-run' || '' }} | tee /tmp/bump.out
          grep -E '^(old_version|new_version|tag)=' /tmp/bump.out >> "$GITHUB_OUTPUT"

      # Same invariant tests.yml and tests/test_version_bump.py assert, checked
      # at the moment it is most likely to be violated: right after a rewrite.
      - name: Verify every declaration still agrees
        if: ${{ !inputs.dry_run }}
        run: python scripts/bump_version.py --check

      # Notes come from the CHANGELOG section for the new version. An empty or
      # missing section must not become an empty Release, so fall back to a
      # compare link that at least tells the reader what changed.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python - <<'PY' > /tmp/notes.md
          import os, pathlib, sys
          sys.path.insert(0, "scripts")
          from bump_version import extract_changelog_section

          new = os.environ["NEW_VERSION"]
          old = os.environ["OLD_VERSION"]
          repo = os.environ["REPO"]
          changelog = pathlib.Path("CHANGELOG.md").read_text()

          body = extract_changelog_section(changelog, new)
          if not body:
              # The automatic patch bump only ever writes a stub, and a
              # hand-written section may not exist yet for this minor version.
              body = (
                  f"No CHANGELOG entry was written for {new}.\n\n"
                  f"See the [full diff]({repo}/compare/v{old}...v{new})."
              )
          print(body)
          PY
          echo "Release notes:"
          cat /tmp/notes.md

      - name: Commit, tag, and publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -- pyproject.toml \
                       meshtastic_hermes/plugin.yaml meshtastic_hermes/__init__.py \
                       meshtastic_platform/plugin.yaml meshtastic_platform/__init__.py \
                       CHANGELOG.md
            # ---------------------------------------------------------------
            # LOOP PREVENTION, LAYERS 2 and 3 of 3 — same reasoning as
            # version-bump.yml. Layer 2: this push uses GITHUB_TOKEN, and
            # GITHUB_TOKEN pushes do not trigger workflows. Layer 3: the
            # "[skip ci]" marker, which is what still holds if branch
            # protection ever forces a PAT here and layer 2 silently
            # disappears — a PAT push DOES trigger workflows.
            # ---------------------------------------------------------------
            git commit -m "chore(release): ${NEW_VERSION} [skip ci]"
            git push origin HEAD:main
          else
            echo "No version change to commit (already at ${NEW_VERSION})."
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::warning::Tag ${TAG} already exists on origin; not re-tagging."
          else
            git tag -a "${TAG}" -m "meshtastic-hermes-plugin ${NEW_VERSION}"
            git push origin "${TAG}"
          fi

          # A re-run after a partial failure should not die on "release already
          # exists"; update the existing one instead.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} exists; updating its notes."
            gh release edit "${TAG}" \
              --notes-file /tmp/notes.md \
              --title "meshtastic-hermes-plugin ${NEW_VERSION}"
          else
            gh release create "${TAG}" \
              --title "meshtastic-hermes-plugin ${NEW_VERSION}" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.bump.outputs.new_version }}"
            echo
            echo "\`${{ steps.bump.outputs.old_version }}\` → \`${{ steps.bump.outputs.new_version }}\` (minor)"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Dry run** — nothing was committed, tagged, or published."
            else
              echo "Tagged \`${{ steps.bump.outputs.tag }}\` and published a GitHub Release."
            fi
            echo
            echo '<details><summary>Release notes</summary>'
            echo
            cat /tmp/notes.md
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
