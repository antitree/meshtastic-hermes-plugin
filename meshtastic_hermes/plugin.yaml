name: meshtastic
version: "0.1.7"
description: >-
  Interact with a Meshtastic LoRa mesh over TCP/IP — send messages, inspect
  nodes/channels, and build a persistent node-interaction knowledge base from
  observed traffic metadata (no payload decryption).
author: Thomas Pham

provides_tools:
  - meshtastic_connect
  - meshtastic_disconnect
  - meshtastic_send_text
  - meshtastic_recent_messages
  - meshtastic_list_nodes
  - meshtastic_node_info
  - meshtastic_list_channels
  - meshtastic_device_metrics
  - meshtastic_kb_summary
  - meshtastic_kb_nodes
  - meshtastic_kb_interactions
  - meshtastic_kb_neighbors

provides_hooks:
  - on_session_start
  - on_session_end

# This plugin has NO hard requirements: every tool that needs a radio takes an
# explicit host argument, and the knowledge-base tools work with no radio at all.
# So there is deliberately no `requires_env:` block here.
#
# `requires_env` entries are treated by Hermes as install-blocking prerequisites
# and are echoed back by `hermes setup` as "Set these env vars"; declaring an
# optional var there produces a nag for something that is not actually missing.
# MESHTASTIC_HOST is declared as REQUIRED by the sibling meshtastic_platform
# manifest, where it genuinely is required (the gateway adapter cannot connect
# without it) — declaring it in both places is what makes the setup hint appear
# twice.
optional_env:
  - name: MESHTASTIC_HOST
    description: "Default Meshtastic node host/IP for TCP auto-connect (e.g. 192.168.1.50). Optional: tools accept an explicit host."
    secret: false
  - name: MESHTASTIC_HERMES_DB
    description: "Path to the SQLite knowledge-base file. Defaults to $HERMES_HOME/meshtastic_kb.sqlite. Optional."
    secret: false
