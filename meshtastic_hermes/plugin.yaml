name: meshtastic
version: "0.1.12"
description: >-
  Interact with a Meshtastic LoRa mesh over TCP/IP — send messages, inspect
  nodes/channels, and build a persistent node-interaction knowledge base from
  observed traffic metadata (no payload decryption).
author: Thomas Pham

provides_tools:
  - meshtastic_connect
  - meshtastic_disconnect
  - meshtastic_send_text
  - meshtastic_recent_messages
  - meshtastic_list_nodes
  - meshtastic_node_info
  - meshtastic_list_channels
  - meshtastic_device_metrics
  - meshtastic_kb_summary
  - meshtastic_kb_nodes
  - meshtastic_kb_interactions
  - meshtastic_kb_neighbors

provides_hooks:
  - on_session_start
  - on_session_end

# This plugin has NO hard requirements: every tool that needs a radio takes an
# explicit host argument, and the knowledge-base tools work with no radio at all.
# So there is deliberately no `requires_env:` block here.
#
# `requires_env` entries are treated by Hermes as install-blocking prerequisites
# and are echoed back by `hermes setup` as "Set these env vars"; declaring an
# optional var there produces a nag for something that is not actually missing.
# MESHTASTIC_HOST is declared as REQUIRED by the sibling meshtastic_platform
# manifest, where it genuinely is required (the gateway adapter cannot connect
# without it) — declaring it in both places is what makes the setup hint appear
# twice.
optional_env:
  - name: MESHTASTIC_HOST
    description: "Meshtastic node host/IP for TCP auto-connect (e.g. 192.0.2.10). AUTHORITATIVE: when set, meshtastic_connect rejects any different tool-supplied host, so a tool call cannot repoint the radio link."
    secret: false
  - name: MESHTASTIC_ALLOW_DYNAMIC_HOSTS
    description: "Set to true to let meshtastic_connect use a caller-supplied host when MESHTASTIC_HOST is unset. Default: false (dynamic hosts rejected). Only an explicit truthy value enables it, so a typo fails closed."
    secret: false
  - name: MESHTASTIC_ALLOWED_HOSTS
    description: "Optional comma-separated allowlist of hostnames, IPs, or CIDR ranges (e.g. 192.0.2.0/24,your-host.example.com) applied when MESHTASTIC_ALLOW_DYNAMIC_HOSTS is on. Unset means any host is allowed once dynamic hosts are enabled."
    secret: false
  # Tool-send transmit policy for meshtastic_send_text. Configured SEPARATELY from
  # the gateway's automatic-reply policy (MESHTASTIC_REPLY_CHANNELS et al) because
  # they are different permissions: a reply is a bounded response to a message that
  # already passed the channel/mention/sender gates, while a tool send is originated
  # by the model, which picks the text, the channel, and the moment with none of
  # those gates in the path. Reply configuration therefore never authorizes a tool
  # send. Default: PKI direct messages only.
  - name: MESHTASTIC_TOOL_SEND_ALLOW_BROADCAST
    description: "Set to true to let meshtastic_send_text originate channel broadcasts at all. Default: false (the tool sends PKI direct messages only). Only an explicit truthy value (1/true/yes/on) enables it, so a typo fails closed."
    secret: false
  - name: MESHTASTIC_TOOL_SEND_CHANNELS
    description: "Comma-separated channel NAMES meshtastic_send_text may transmit on, e.g. 'in.secure' or 'in.secure,ops'. Same grammar and resolution as MESHTASTIC_REPLY_CHANNELS, but a separate setting: names are resolved against the radio's channel table on every send, numeric indices are legacy and warn (an index is a SLOT, not a channel identity), and 'all' means every channel. Unset means no channel broadcast is allowed."
    secret: false
  - name: MESHTASTIC_TOOL_SEND_ALLOW_PRIMARY
    description: "Set to true to allow meshtastic_send_text on the PRIMARY channel, whose pre-shared key is public on a default radio. Required IN ADDITION to MESHTASTIC_TOOL_SEND_ALLOW_BROADCAST and a matching MESHTASTIC_TOOL_SEND_CHANNELS entry. Default: false."
    secret: false
  # Transmit rate limiting — the airtime LOOP BREAKER. LoRa is a shared, legally
  # regulated medium, and nothing else bounds how much this node emits: the adapter
  # caps one reply to five parts, but repeated messages or a model in a tool loop
  # can transmit indefinitely, and two bots on one channel will answer each other
  # forever. One shared limiter covers every outbound path (tool sends, adapter
  # replies, bridge --send), and every transmitted PACKET costs one token — each
  # part of a multi-part reply included, since each part is real airtime.
  # All four fail CLOSED: an unparseable or non-positive value falls back to the
  # conservative default. There is deliberately no way to spell "unlimited".
  - name: MESHTASTIC_MAX_SENDS_PER_MINUTE
    description: "Maximum outbound PACKETS per minute across every destination and every path (tool sends, gateway replies, bridge --send). Each part of a multi-part reply counts separately. Default: 10. Invalid or non-positive values fall back to the default — there is no 'unlimited'."
    secret: false
  - name: MESHTASTIC_MAX_CHANNEL_SENDS_PER_MINUTE
    description: "Maximum broadcast packets per minute on any ONE channel index. Independent of the DM budget, so answering DMs never consumes a channel's broadcast allowance. Default: 5. Invalid values fall back to the default."
    secret: false
  - name: MESHTASTIC_MAX_DM_SENDS_PER_MINUTE
    description: "Maximum direct-message packets per minute to any ONE peer node id, so a single chatty peer cannot consume another's allowance. Default: 6. Invalid values fall back to the default."
    secret: false
  - name: MESHTASTIC_REPLY_COOLDOWN_SECONDS
    description: "Minimum seconds between two consecutive conversational turns to the same destination. This is what breaks a tight bot-to-bot ping-pong before the per-minute buckets even fill. Parts 2..n of one multi-part reply are exempt from the cooldown (they still cost a token each). Default: 5. Invalid values fall back to the default."
    secret: false
  - name: MESHTASTIC_HERMES_DB
    description: "Path to the SQLite knowledge-base file. Defaults to $HERMES_HOME/meshtastic_kb.sqlite. Optional."
    secret: false
  - name: MESHTASTIC_FAILURE_THRESHOLD
    description: "Consecutive failed connect attempts before status reports 'disconnected' instead of 'connecting'. Default: 10."
    secret: false
  - name: MESHTASTIC_SLOW_RETRY_SECONDS
    description: "Retry interval (seconds) once the failure threshold is exceeded. Retrying never stops, it just slows down. Default: 300."
    secret: false
