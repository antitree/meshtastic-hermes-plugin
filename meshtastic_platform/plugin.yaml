name: meshtastic-platform
label: Meshtastic
kind: platform
version: "0.1.6"
description: >-
  Meshtastic LoRa mesh gateway adapter for Hermes Agent. Relays inbound mesh text
  messages to the agent and sends the agent's replies back over the radio. Direct
  messages are end-to-end (PKI) encrypted; replies default to direct messages only.
author: Thomas Pham

requires_env:
  - name: MESHTASTIC_HOST
    description: "Meshtastic node host/IP to connect to over TCP (e.g. 192.168.55.73)."
    prompt: "Meshtastic node host/IP"
    password: false

optional_env:
  - name: MESHTASTIC_REPLY_ALL
    description: "Reply on every channel incl. public Primary (1/true/yes). Default: DMs only."
    prompt: "Reply on all channels? (true/false)"
    password: false
  - name: MESHTASTIC_REPLY_CHANNELS
    description: >-
      Reply on DMs plus these channels, by NAME — e.g. 'in.secure' or
      'in.secure,ops' (comma-separated, case-sensitive; names may contain dots and
      spaces). Names are resolved against the radio's channel table on every connect,
      so renaming or reordering channels moves the allowlist with the name. Numeric
      indices ('1', '1,2') still work but are LEGACY and unsafe: an index is a radio
      SLOT, not a channel identity, so reordering channels silently repoints it and
      replies meant for a private channel can go out on the public Primary. A name
      that is not on the radio logs a warning and is skipped; the rest still applies.
      Public Primary is excluded unless listed (target an unnamed primary as
      'Primary'). Discover names with the meshtastic_list_channels tool.
    prompt: "Reply channel names (comma-separated, e.g. in.secure) or empty"
    password: false
  - name: MESHTASTIC_REQUIRE_MENTION
    description: >-
      Require a CHANNEL message to be addressed to this node before the bot
      replies. Default TRUE — set to 0/false/no (case-insensitive) to reply to
      every message on an allowlisted channel. A message counts as addressed when
      it STARTS WITH this node's short name, long name, or node id, e.g. 'REDB
      weather', 'redb: weather', '@RED Box weather', '!deadbeef weather' — case-
      insensitive, an optional leading '@', the node id with or without its '!',
      and a ':'/',' or space after the name. A mention mid-sentence ('ask REDB
      about the weather') does NOT count. The mention is stripped before the text
      reaches the agent. DIRECT MESSAGES are always answered and never need a
      mention. Turning this off is what lets two bots on one channel reply to each
      other forever; this plugin has no rate limit or loop detection, and LoRa is
      shared, regulated spectrum.
    prompt: "Require channel messages to start with this node's name? (true/false)"
    password: false
  - name: MESHTASTIC_HERMES_DB
    description: "Path to the node-interaction knowledge-base SQLite file (defaults under $HERMES_HOME)."
    prompt: "Knowledge-base DB path (or empty)"
    password: false
  - name: MESHTASTIC_DEBUG
    description: "Set to 1 to log inbound messages and reply/skip decisions to the gateway journal."
    prompt: "Enable debug logging? (1/true)"
    password: false
  - name: MESHTASTIC_ALLOWED_USERS
    description: "Comma-separated node ids allowed to talk to the agent, e.g. '!a696579c,!0aca4a9c'. Empty + allow-all off = nobody (deny by default)."
    prompt: "Allowed node ids (comma-separated)"
    password: false
  - name: MESHTASTIC_ALLOW_ALL_USERS
    description: "Allow any node on the mesh to talk to the agent (1/true). Use with care on public channels."
    prompt: "Allow all users? (true/false)"
    password: false
